<section class="com-temp" data-lethink-dynamic='{
  "execute_path": "/cmsapi/api.api/execute",
  "form": {
    "selector": ".form",
    "schema": {{$Var@lead_form}},
    "status": "[data-lethink-form-status]",
    "success_text": "提交成功，我们会尽快与您联系"
  }
}'>
  <h2>{{$Var@title}}</h2>
  <form class="form" method="post">
    <label>姓名 <input type="text" name="name" required maxlength="50" autocomplete="name"></label>
    <label>联系方式 <input type="tel" name="phone" required maxlength="20" autocomplete="tel"></label>
    <label>邮箱 <input type="email" name="email" maxlength="100" autocomplete="email"></label>
    <label>备注 <textarea name="remark" required maxlength="1000"></textarea></label>
    <p data-lethink-form-status role="status" aria-live="polite">表单正在初始化…</p>
    <button type="submit" disabled>{{$Var@submit_text}}</button>
  </form>
</section>
